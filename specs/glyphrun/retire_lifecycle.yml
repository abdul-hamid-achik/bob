version: 1
name: bob_retire_lifecycle
intent: |
    When a files workspace drops a declared path, bob apply still refuses by
    default (a retired_owned conflict, nothing deleted). With --allow-retire the
    plan reports a retire action, and apply deletes the dropped lock-owned file
    and drops it from bob.lock.
target:
    cmd:
        - /bin/sh
        - -c
        - |
          set -eu
          root="$(mktemp -d "/tmp/bob-glyph-retire.XXXXXX")"
          trap 'rm -rf "$root"' EXIT
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: retire-demo
            description: retire lifecycle spec
          files:
            - path: keep.txt
              content: keep me
            - path: drop.txt
              content: drop me
          BOBEOF
          ./bin/bob apply "$root" >/dev/null
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: retire-demo
            description: retire lifecycle spec
          files:
            - path: keep.txt
              content: keep me
          BOBEOF
          set +e
          ./bin/bob apply "$root" >/dev/null 2>&1
          refused_exit=$?
          set -e
          printf 'refused_exit=%s\n' "$refused_exit"
          if [ -e "$root/drop.txt" ]; then printf 'drop_survives_conflict=true\n'; fi
          plan="$(./bin/bob plan "$root" --allow-retire --json)"
          printf 'retire_kind=%s\n' "$(printf '%s' "$plan" | jq -r '.data.actions[] | select(.path == "drop.txt") | .kind')"
          printf 'retire_code=%s\n' "$(printf '%s' "$plan" | jq -r '.data.actions[] | select(.path == "drop.txt") | .code')"
          ./bin/bob apply "$root" --allow-retire >/dev/null
          if [ ! -e "$root/drop.txt" ]; then printf 'drop_deleted=true\n'; fi
          if [ -e "$root/keep.txt" ]; then printf 'keep_survives=true\n'; fi
          if ! grep -q 'drop.txt' "$root/bob.lock"; then printf 'lock_dropped=true\n'; fi
    cwd: .
terminal:
    cols: 180
    rows: 80
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: retire_lifecycle
outcomes:
    - id: refuses_without_flag
      description: applying a dropped path without --allow-retire exits 2 (conflict)
      verify:
        screen:
            contains: refused_exit=2
    - id: conflict_deletes_nothing
      description: the dropped file survives the refused apply
      verify:
        screen:
            contains: drop_survives_conflict=true
    - id: plan_reports_retire
      description: --allow-retire classifies the dropped path as a retire action
      verify:
        screen:
            contains: retire_kind=retire
    - id: retire_code_stable
      description: the retire action carries the retired_unchanged code
      verify:
        screen:
            contains: retire_code=retired_unchanged
    - id: apply_deletes_file
      description: apply --allow-retire deletes the dropped lock-owned file
      verify:
        screen:
            contains: drop_deleted=true
    - id: keeps_other_files
      description: apply --allow-retire leaves the remaining declared file intact
      verify:
        screen:
            contains: keep_survives=true
    - id: lock_drops_path
      description: bob.lock no longer records the dropped path
      verify:
        screen:
            contains: lock_dropped=true
contractHash: sha256:036c204a0562e1db6f15e7a35450aafe8b061e5d4494c6903b13db8118ee9582
