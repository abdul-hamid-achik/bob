version: 1
name: bob_plan_retire_json
intent: |
    The JSON surface of the opt-in retire action. When a files workspace drops a
    declared path, bob plan --json (no flag) reports the path as a conflict with
    code retired_owned and conflict_count 1. With --allow-retire the same path is
    a retire action with code retired_unchanged, conflict_count 0, and exactly one
    retire action in the plan. Both plans exit 0.
target:
    cmd:
        - /bin/sh
        - -c
        - |
          set -eu
          root="$(mktemp -d "/tmp/bob-glyph-retirejson.XXXXXX")"
          trap 'rm -rf "$root"' EXIT
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: retire-json-demo
            description: retire JSON surface spec
          files:
            - path: keep.txt
              content: keep me
            - path: drop.txt
              content: drop me
          BOBEOF
          ./bin/bob apply "$root" >/dev/null
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: retire-json-demo
            description: retire JSON surface spec
          files:
            - path: keep.txt
              content: keep me
          BOBEOF
          no_flag="$(./bin/bob plan "$root" --json)"
          printf 'no_flag_exit=0\n'
          printf 'no_flag_kind=%s\n' "$(printf '%s' "$no_flag" | jq -r '.data.actions[] | select(.path == "drop.txt") | .kind')"
          printf 'no_flag_code=%s\n' "$(printf '%s' "$no_flag" | jq -r '.data.actions[] | select(.path == "drop.txt") | .code')"
          printf 'no_flag_conflicts=%s\n' "$(printf '%s' "$no_flag" | jq -r '.data.conflict_count')"
          allow_retire="$(./bin/bob plan "$root" --allow-retire --json)"
          printf 'allow_retire_exit=0\n'
          printf 'retire_kind=%s\n' "$(printf '%s' "$allow_retire" | jq -r '.data.actions[] | select(.path == "drop.txt") | .kind')"
          printf 'retire_code=%s\n' "$(printf '%s' "$allow_retire" | jq -r '.data.actions[] | select(.path == "drop.txt") | .code')"
          printf 'retire_count=%s\n' "$(printf '%s' "$allow_retire" | jq -r '[.data.actions[] | select(.kind == "retire")] | length')"
          printf 'allow_retire_conflicts=%s\n' "$(printf '%s' "$allow_retire" | jq -r '.data.conflict_count')"
    cwd: .
terminal:
    cols: 180
    rows: 80
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: plan_retire_json
outcomes:
    - id: no_flag_plan_exits_zero
      description: plan --json without --allow-retire exits 0
      verify:
        screen:
            contains: no_flag_exit=0
    - id: no_flag_reports_conflict
      description: the dropped path is a conflict without --allow-retire
      verify:
        screen:
            contains: no_flag_kind=conflict
    - id: no_flag_retired_owned_code
      description: the conflict carries the retired_owned code
      verify:
        screen:
            contains: no_flag_code=retired_owned
    - id: no_flag_one_conflict
      description: the default plan reports exactly one conflict
      verify:
        screen:
            contains: no_flag_conflicts=1
    - id: allow_retire_plan_exits_zero
      description: plan --allow-retire --json exits 0
      verify:
        screen:
            contains: allow_retire_exit=0
    - id: allow_retire_reports_retire
      description: --allow-retire classifies the dropped path as a retire action
      verify:
        screen:
            contains: retire_kind=retire
    - id: allow_retire_unchanged_code
      description: the retire action carries the retired_unchanged code
      verify:
        screen:
            contains: retire_code=retired_unchanged
    - id: retire_count_one
      description: the plan actions contain exactly one retire action
      verify:
        screen:
            contains: retire_count=1
    - id: allow_retire_conflict_free
      description: --allow-retire leaves the plan conflict-free
      verify:
        screen:
            contains: allow_retire_conflicts=0
contractHash: sha256:41dc5f87354e311ba525d9d29ae2d2aa5660f90e4c7272f23a21d81baf28c3b4
