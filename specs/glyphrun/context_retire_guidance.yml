version: 1
name: bob_context_retire_guidance
intent: |
    bob context guides a dropped lock-owned path as a typed, machine-branchable
    notice. After a files workspace applies a declared file and then drops that
    declaration, bob context --json exits 0 with ok=true and its data.notices[]
    carries a typed notice whose code is retired_owned — the conflict-guidance
    path, because context plans without --allow-retire and so the dropped path
    stays a retired_owned conflict rather than an authorized retire action.
target:
    cmd:
        - /bin/sh
        - -c
        - |
          set -eu
          root="$(mktemp -d "/tmp/bob-glyph-ctxretire.XXXXXX")"
          trap 'rm -rf "$root"' EXIT
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: retire-context-demo
            description: context retire guidance spec
          files:
            - path: keep.txt
              content: keep me
            - path: drop.txt
              content: drop me
          BOBEOF
          ./bin/bob apply "$root" >/dev/null
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: retire-context-demo
            description: context retire guidance spec
          files:
            - path: keep.txt
              content: keep me
          BOBEOF
          set +e
          ./bin/bob context "$root" --json > "$root/context.json" 2>/dev/null
          context_exit=$?
          set -e
          printf 'context_exit=%s\n' "$context_exit"
          printf 'context_ok=%s\n' "$(jq -r '.ok' "$root/context.json")"
          printf 'retired_notice_count=%s\n' "$(jq -r '[.data.notices[] | select(.code == "retired_owned")] | length' "$root/context.json")"
          printf 'retired_notice_id=%s\n' "$(jq -r '.data.notices[] | select(.code == "retired_owned") | .id' "$root/context.json")"
          printf 'retired_notice_severity=%s\n' "$(jq -r '.data.notices[] | select(.code == "retired_owned") | .severity' "$root/context.json")"
          printf 'retired_notice_paths=%s\n' "$(jq -r '[.data.notices[] | select(.code == "retired_owned") | .paths[]] | join(",")' "$root/context.json")"
    cwd: .
terminal:
    cols: 180
    rows: 80
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: context_retire_guidance
outcomes:
    - id: context_exits_zero
      description: bob context --json on a retired path exits 0
      verify:
        screen:
            contains: context_exit=0
    - id: context_ok_true
      description: the context envelope reports ok=true
      verify:
        screen:
            contains: context_ok=true
    - id: notice_carries_retired_owned_code
      description: data.notices contains exactly one notice coded retired_owned
      verify:
        screen:
            contains: retired_notice_count=1
    - id: notice_typed_conflict_guidance
      description: the retired_owned notice is typed with the conflict-guidance id
      verify:
        screen:
            contains: retired_notice_id=retired_owned_conflict
    - id: notice_severity_warning
      description: the retired_owned conflict notice is a warning
      verify:
        screen:
            contains: retired_notice_severity=warning
    - id: notice_names_dropped_path
      description: the notice names the dropped lock-owned path
      verify:
        screen:
            contains: retired_notice_paths=drop.txt
contractHash: sha256:5198e129d076d2f4a3da06de6a8a459fa4386de1bad0ccaec5aade1860de4867
