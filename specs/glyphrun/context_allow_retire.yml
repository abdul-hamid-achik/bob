version: 1
name: bob_context_allow_retire
intent: |
    bob context --allow-retire previews the retire case. After a files
    workspace applies a declared file and then drops that declaration, the
    default bob context --json reports state conflicted with a retired_owned
    notice (the retired_owned_conflict warning). With --allow-retire the same
    workspace reports state drifted, the retired_owned notice is info (id
    retired_owned), and an apply_retire action carries --allow-retire in its
    argv with requires_explicit_authority true.
target:
    cmd:
        - /bin/sh
        - -c
        - |
          set -eu
          root="$(mktemp -d "/tmp/bob-glyph-ctxallow.XXXXXX")"
          trap 'rm -rf "$root"' EXIT
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: allow-retire-context-demo
            description: context --allow-retire preview spec
          files:
            - path: keep.txt
              content: keep me
            - path: drop.txt
              content: drop me
          BOBEOF
          ./bin/bob apply "$root" >/dev/null
          cat > "$root/bob.yaml" <<'BOBEOF'
          schema_version: 1
          recipe: files
          product:
            name: allow-retire-context-demo
            description: context --allow-retire preview spec
          files:
            - path: keep.txt
              content: keep me
          BOBEOF
          ./bin/bob context "$root" --json > "$root/context.json"
          printf 'default_state=%s\n' "$(jq -r '.data.repository.state' "$root/context.json")"
          printf 'default_retired_code=%s\n' "$(jq -r '[.data.notices[] | select(.code == "retired_owned") | .code] | join(",")' "$root/context.json")"
          printf 'default_retired_id=%s\n' "$(jq -r '[.data.notices[] | select(.code == "retired_owned") | .id] | join(",")' "$root/context.json")"
          printf 'default_retired_severity=%s\n' "$(jq -r '[.data.notices[] | select(.code == "retired_owned") | .severity] | join(",")' "$root/context.json")"
          ./bin/bob context "$root" --allow-retire --json > "$root/context_allow.json"
          printf 'allow_state=%s\n' "$(jq -r '.data.repository.state' "$root/context_allow.json")"
          printf 'allow_retired_id=%s\n' "$(jq -r '[.data.notices[] | select(.code == "retired_owned") | .id] | join(",")' "$root/context_allow.json")"
          printf 'allow_retired_severity=%s\n' "$(jq -r '[.data.notices[] | select(.code == "retired_owned") | .severity] | join(",")' "$root/context_allow.json")"
          printf 'allow_apply_retire_authority=%s\n' "$(jq -r '.data.actions[] | select(.id == "apply_retire") | .requires_explicit_authority' "$root/context_allow.json")"
          printf 'allow_apply_retire_has_flag=%s\n' "$(jq -r '[.data.actions[] | select(.id == "apply_retire") | .argv[] | select(. == "--allow-retire")] | length' "$root/context_allow.json")"
    cwd: .
terminal:
    cols: 180
    rows: 80
    profile: xterm-256color
steps:
    - wait:
        process:
            exitCode: 0
        timeoutMs: 15000
    - snapshot: context_allow_retire
outcomes:
    - id: default_state_conflicted
      description: context --json on a dropped path reports state conflicted
      verify:
        screen:
            contains: default_state=conflicted
    - id: default_notice_retired_owned
      description: the default context carries a retired_owned notice
      verify:
        screen:
            contains: default_retired_code=retired_owned
    - id: default_notice_conflict_id
      description: the default retired_owned notice is the retired_owned_conflict warning
      verify:
        screen:
            contains: default_retired_id=retired_owned_conflict
    - id: default_notice_warning
      description: the default retired_owned notice severity is warning
      verify:
        screen:
            contains: default_retired_severity=warning
    - id: allow_state_drifted
      description: context --allow-retire --json reports state drifted
      verify:
        screen:
            contains: allow_state=drifted
    - id: allow_notice_info_id
      description: the allow-retire notice is id retired_owned
      verify:
        screen:
            contains: allow_retired_id=retired_owned
    - id: allow_notice_info
      description: the allow-retire notice severity is info
      verify:
        screen:
            contains: allow_retired_severity=info
    - id: allow_action_authority
      description: the apply_retire action requires explicit authority
      verify:
        screen:
            contains: allow_apply_retire_authority=true
    - id: allow_action_argv_flag
      description: the apply_retire action argv contains --allow-retire
      verify:
        screen:
            contains: allow_apply_retire_has_flag=1
contractHash: sha256:0ede51922a4c5ff1c118534d584a503bf8c8938d2c0c968b4ba9b9b710030117
